name: Build VPS Image

on:
  push:
    branches:
      - deploy/v0.1.162-grok-cleanup-20260722
    paths:
      - .dockerignore
      - Dockerfile
      - backend/**
      - frontend/**
      - docs/legal/**
      - deploy/docker-entrypoint.sh
      - .github/workflows/vps-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vps-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable amd64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:deploy-${{ github.sha }}
          build-args: |
            VERSION=0.1.162-kei-grok-cleanup
            COMMIT=${{ github.sha }}
            NODE_OPTIONS=--max-old-space-size=4096
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          cache-from: type=gha,scope=vps-image-v0162
          cache-to: type=gha,mode=max,scope=vps-image-v0162
